<!doctype html>
<!-- bfain.studio launch Story v3 "נסה לא לעצור.", 1080x1920, 12 s. Deterministic: window.render(t) draws the frame
     at t seconds; story/render.mjs captures it frame by frame and mixes the audio.
     Concept: a challenge to the viewer. The views counter is "already stopped"; the freeze says they stopped too;
     the end card dares them to get through every Reel without stopping, and taps the link-sticker zone.
     Every number is read from data/instagram.json at render time. Music: 120 BPM, a beat every 0.5 s, silence
     3.0-3.5, drop at 3.5. Safe zones: nothing important above y 270 or below y 1536. Footage in story/work:
     hook/ (six Reels at their peak moments), site/ + site.json (live-site recording), pop/ (the payoff). -->
<html lang="he">
<head>
<meta charset="utf-8">
<title>bfain.studio launch Story</title>
<link rel="stylesheet" href="https://use.typekit.net/gce3kmw.css">
<style>
@font-face { font-family: "Hebrew"; font-weight: 100 900; src: url("../assets/fonts/noto-sans-hebrew-var-hebrew.woff2") format("woff2"); }
:root { --void: #07071C; --navy: #1A1464; --cyan: #00C2FF; --cream: #F4F0E8; --display: "narkiss-hadash-condensed", "Hebrew", sans-serif; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: clip; background: var(--void); color: var(--cream); font-family: "Hebrew", sans-serif; }
.layer { position: absolute; inset: 0; }
.big, .chip, .small { direction: rtl; }
#bg { background: radial-gradient(900px 760px at 50% 46%, rgb(26 20 100 / 0.95), transparent 70%), radial-gradient(640px 460px at 50% 80%, rgb(0 194 255 / 0.14), transparent 70%), var(--void); }
#wall { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.card { position: absolute; width: 300px; height: 533px; margin: -266px 0 0 -150px; border-radius: 24px; overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
#endShade { background: radial-gradient(80% 60% at 50% 50%, rgb(7 7 28 / 0.9), rgb(7 7 28 / 0.75) 70%, rgb(7 7 28 / 0.85)); }
#zoneGlow { position: absolute; left: 540px; top: 1462px; width: 860px; height: 300px; translate: -50% -50%; border-radius: 50%; background: radial-gradient(closest-side, rgb(0 194 255 / 0.34), rgb(0 194 255 / 0.08) 60%, transparent); }
#bezel { position: absolute; background: linear-gradient(160deg, #23234a, #0b0b1d 40%, #16163a); box-shadow: 0 70px 140px rgb(0 0 0 / 0.65), 0 0 160px rgb(0 194 255 / 0.2), inset 0 0 0 2px rgb(255 255 255 / 0.09); }
#screen, #pop { position: absolute; overflow: hidden; background: #000; }
#screen canvas, #pop canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#island { position: absolute; border-radius: 30px; background: #000; translate: -50% 0; }
#shade { position: absolute; inset: 0; }
.big { position: absolute; inset-inline: 0; text-align: center; font-family: var(--display); font-weight: 800; line-height: 0.92; }
.small { position: absolute; inset-inline: 0; text-align: center; font: 600 64px/1.15 "Hebrew", sans-serif; }
.w { display: inline-block; overflow: clip; padding-block: 0.08em; margin-block: -0.08em; vertical-align: top; }
.w > span { display: inline-block; }
.cyan { color: var(--cyan); }
#numBox { position: absolute; inset-inline: 0; top: 1218px; height: 210px; overflow: clip; text-align: center; }
#num { display: inline-block; font: 800 200px/1 var(--display); }
.chip { position: absolute; display: inline-flex; align-items: center; gap: 16px; padding: 20px 34px; border-radius: 100px; background: rgb(7 7 28 / 0.82); border: 1.5px solid rgb(244 240 232 / 0.16); backdrop-filter: blur(14px); font: 700 64px/1 var(--display); white-space: nowrap; box-shadow: 0 20px 50px rgb(0 0 0 / 0.45); }
.chip .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 8px rgb(0 194 255 / 0.18); }
.ripple { position: absolute; border-radius: 50%; translate: -50% -50%; }
#tapDot, #endDot { width: 78px; height: 78px; background: rgb(244 240 232 / 0.92); box-shadow: 0 6px 24px rgb(0 0 0 / 0.5); }
#tapRing, #endRing { width: 78px; height: 78px; border: 6px solid var(--cyan); }
#logo { position: absolute; left: 50%; translate: -50% 0; width: 250px; top: 330px; }
#logo svg { width: 100%; height: auto; display: block; overflow: visible; }
#arrows { position: absolute; left: 50%; translate: -50% 0; top: 1268px; display: flex; flex-direction: column; align-items: center; }
#arrows svg { display: block; margin-block-start: -14px; }
#flash { background: var(--cream); mix-blend-mode: overlay; }
</style>
</head>
<body>
<div id="bg" class="layer"></div>
<div id="wall"></div>
<div id="endShade" class="layer"></div>
<div id="zoneGlow"></div>

<div id="bezel"></div>
<div id="screen"><canvas id="cv"></canvas><div id="island"></div><div id="shade"></div></div>
<div id="pop"><canvas id="pv"></canvas></div>

<!-- hook: the challenge, and the counter of people who already stopped -->
<div id="tryTop" class="big" style="top:300px;font-size:150px"><span class="w"><span>נסה</span></span> <span class="w"><span>לא</span></span> <span class="w"><span class="cyan">לעצור.</span></span></div>
<div id="numLabel" class="small cyan" style="top:1138px">כבר עצרו:</div>
<div id="numBox"><bdi dir="ltr" id="num">0</bdi></div>
<div id="numUnit" class="small" style="top:1430px">צפיות</div>

<!-- the reversal -->
<div id="stopped" class="big" style="top:640px;font-size:330px">עצרת.</div>
<div id="likeOthers" class="small" style="top:470px"></div>

<div id="chipLive" class="chip"><span class="dot"></span>מתעדכן כל שעה</div>
<div id="tapRing" class="ripple"></div><div id="tapDot" class="ripple"></div>

<!-- end card -->
<div id="logo"></div>
<div id="endA" class="big" style="top:520px;font-size:200px"><span class="w"><span id="endCount">18</span></span> <span class="w"><span>סרטונים.</span></span></div>
<div id="endB" class="big" style="top:740px;font-size:150px"><span class="w"><span>נסה</span></span> <span class="w"><span>לעבור</span></span> <span class="w"><span>את</span></span> <span class="w"><span>כולם</span></span></div>
<div id="endC" class="big cyan" style="top:900px;font-size:200px"><span class="w"><span>בלי</span></span> <span class="w"><span>לעצור.</span></span></div>
<div id="arrows"></div>
<div id="endRing" class="ripple"></div><div id="endDot" class="ripple"></div>
<div id="flash" class="layer"></div>

<script>
const W = 1080, H = 1920, FPS = 30;
const SITE = { w: 390, h: 844 };
const SW = 528, SH = Math.round(SW * SITE.h / SITE.w), BZ = 17;     // phone screen 528x1143
const ZONE = { x: 540, y: 1462 };                                    // link-sticker centre
// Hook: six Reels at their peak moments, one per beat; c = frame folder index, z = zoom (letterboxed Reel).
const HOOK = [
  { c: 0, id: '17943051837086700', a: 0.0, z: 2.0 },   // letterboxed: 2x pushes its burned-in title off the top
  { c: 1, id: '18112796969467846', a: 0.5, z: 1 },
  { c: 2, id: '18115863469771345', a: 1.0, z: 1 },
  { c: 3, id: '17996145848834714', a: 1.5, z: 1 },
  { c: 4, id: '18130994455682363', a: 2.0, z: 1 },   // red-carpet parking (the stadium Reel's subtitles sat on the counter)
  { c: 5, id: '17901612813374816', a: 2.5, z: 1 },
];
const POSTERS = ['17943051837086700','18112796969467846','18115863469771345','17996145848834714','17957239818238876','17981987253079891','18130994455682363','18633783094026616','17901612813374816','18113922386100931','18105146096190451','17958556212232372','18127153129842174','18487666432129017','18110908592128454','18627196816008046','18118270045962443'];
let D = null, siteMeta = null;           // live data and the site recording's marks

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (k) => 1 - (1 - k) ** 3;
const eInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2);
const eBack = (k) => { const c = 1.7; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; };
const bounce = (k) => { const n = 7.5625, d = 2.75;
  if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
  if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375; return n * (k -= 2.625 / d) * k + 0.984375; };
const set = (el, css) => Object.assign(el.style, css);
const env = (t, a, b, ri = 0.3, fo = 0.3) => Math.min(eOut(prog(t, a, a + ri)), 1 - eInOut(prog(t, b - fo, b)));
const pad = (n, l) => String(n).padStart(l, '0');
const piece = (t, pts) => { if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
  return pts[pts.length - 1][1]; };
const words = (el, t, start, gap = 0.07, dur = 0.34) => el.querySelectorAll('.w > span').forEach((s, i) => {
  const k = eOut(prog(t, start + i * gap, start + i * gap + dur)); s.style.transform = `translateY(${(1 - k) * 108}%)`; });
const fmt = new Intl.NumberFormat('he-IL');

// wall (end-card background)
const SLOTS = [];
for (let c = 0; c < 5; c++) for (let r = 0; r < 4; r++) {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<img src="../media/ig/${POSTERS[(c * 4 + r * 3) % POSTERS.length]}.webp" alt="">`;
  $('wall').append(el);
  SLOTS.push({ el, x: (c - 2) * 322, y: (r - 1.5) * 555 + (c % 2 ? 140 : -60), d: ((c * 7 + r * 5) % 11) / 11 });
}
fetch('work/logo.svg').then((r) => r.text()).then((s) => { $('logo').innerHTML = s.replace(/<metadata>[\s\S]*?<\/metadata>/, ''); });
$('arrows').innerHTML = [0, 1].map(() => '<svg width="70" height="44" viewBox="0 0 70 44"><path d="M6 6 L35 34 L64 6" fill="none" stroke="#00C2FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>').join('');

const cache = new Map();
const img = (url) => { if (!cache.has(url)) { const im = new Image(); im.src = url; cache.set(url, im.decode().then(() => im)); if (cache.size > 16) cache.delete(cache.keys().next().value); } return cache.get(url); };
const cover = (ctx, im, cw, ch, z = 1, alpha = 1) => { const s = Math.max(cw / im.naturalWidth, ch / im.naturalHeight) * z, w = im.naturalWidth * s, h = im.naturalHeight * s;
  ctx.globalAlpha = alpha; ctx.drawImage(im, (cw - w) / 2, (ch - h) / 2, w, h); ctx.globalAlpha = 1; };
const cv = $('cv'), ctx = cv.getContext('2d'), pv = $('pv'), pctx = pv.getContext('2d');
const size = (c, w, h) => { w = Math.max(2, Math.round(w)); h = Math.max(2, Math.round(h)); if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } };

window.ready = (async () => {
  const m = await (await fetch('../data/instagram.json', { cache: 'no-store' })).json();
  const views = Object.fromEntries(m.items.map((i) => [i.id, i.views || 0]));
  let cum = 0;
  D = { total: m.stats.total_views, reels: m.stats.shown, cum: HOOK.map((h) => (cum += views[h.id])) };
  $('likeOthers').textContent = `כמו עוד ${fmt.format(D.total)} צפיות.`;
  $('endCount').textContent = D.reels;
  siteMeta = await (await fetch('work/site.json', { cache: 'no-store' })).json();
  await document.fonts.load('800 100px narkiss-hadash-condensed', 'אבג0');
  await document.fonts.load('600 40px Hebrew', 'א');
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  return document.fonts.check('800 100px narkiss-hadash-condensed', 'א') && { total: D.total, reels: D.reels, cum: D.cum };
})();

// Site recording time for story time t (marks from story/record-site.mjs).
const siteTime = (t) => { const k = siteMeta.marks; return piece(t, [[3.5, 0.2], [4.1, k.proofScroll], [4.6, k.holdStart], [6.1, k.holdStart + 1.5], [6.25, k.holdEnd], [6.75, k.gridEnd], [7.0, k.tap], [7.3, k.tap + 0.3]]); };
const TAP_T = 7.0;

// Virtual camera on the phone: small and low under the reversal text, then full size.
const cam = (t) => {
  const lowK = 1 - eInOut(prog(t, 4.6, 5.0));
  const sc = lerp(1.0, 0.74, lowK);
  let cx = 540, cy = lerp(903, 1060, lowK) + Math.sin(t * 1.5) * 5;
  if (t > TAP_T && t < TAP_T + 0.2) { const k = (t - TAP_T) / 0.2; cx += Math.sin(k * 40) * 5 * (1 - k); }
  return { sc, cx, cy };
};

window.render = async (t) => {
  // ---------- phone / full-bleed screen ----------
  const c = cam(t);
  const phone = { x: c.cx - SW * c.sc / 2, y: c.cy - SH * c.sc / 2, w: SW * c.sc, h: SH * c.sc, r: 60 * c.sc };
  const m = eInOut(prog(t, 3.5, 3.95));                          // shrink into the phone on the drop
  const rect = { x: lerp(0, phone.x, m), y: lerp(0, phone.y, m), w: lerp(W, phone.w, m), h: lerp(H, phone.h, m), r: lerp(0, phone.r, m) };
  const ry = lerp(9, -5, eInOut(prog(t, 3.9, 7.0))) * m, rx = lerp(3, -2, prog(t, 3.9, 7.0)) * m;
  const popK = eInOut(prog(t, 7.0, 7.3));
  const gone = eOut(prog(t, 7.02, 7.28));
  const tf = `perspective(2600px) rotateY(${ry * (1 - popK)}deg) rotateX(${rx * (1 - popK)}deg) scale(${1 + gone * 0.25})`;
  const shown = t < 7.3 ? 'block' : 'none';
  const frozen = t >= 3.0 && t < 3.5;
  set($('screen'), { left: rect.x + 'px', top: rect.y + 'px', width: rect.w + 'px', height: rect.h + 'px', borderRadius: rect.r + 'px', transform: tf, opacity: 1 - gone, display: shown,
    filter: frozen ? 'grayscale(0.7) brightness(0.45) contrast(1.1)' : 'none' });
  set($('bezel'), { left: phone.x - BZ * c.sc + 'px', top: phone.y - BZ * c.sc + 'px', width: phone.w + 2 * BZ * c.sc + 'px', height: phone.h + 2 * BZ * c.sc + 'px', borderRadius: 80 * c.sc + 'px', opacity: eOut(prog(t, 3.65, 3.95)) * (1 - gone), transform: tf, display: shown });
  set($('island'), { left: rect.w / 2 + 'px', top: 15 * c.sc + 'px', width: 140 * c.sc + 'px', height: 40 * c.sc + 'px', opacity: prog(t, 3.75, 3.95) });

  if (t < 7.3) {
    const hi = m > 0.5 ? 1.45 : 1;
    size(cv, rect.w * hi, rect.h * hi);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    const siteK = prog(t, 3.5, 3.62);
    if (siteK < 1) {
      let h = HOOK.length - 1; while (h > 0 && t < HOOK[h].a) h--;
      const hk = HOOK[h], fi = t >= 3.0 ? 14 : Math.min(14, Math.floor((t - hk.a) * FPS));   // freeze on the last frame
      const punch = t >= 3.0 ? 1.0 : lerp(hk.z > 1 ? 1.06 : 1.12, 1, eOut(prog(t, hk.a, hk.a + 0.45)));
      cover(ctx, await img(`work/hook/c${hk.c}_${pad(fi + 1, 2)}.jpg`), cv.width, cv.height, hk.z * punch);
      if (hk.c === 0) { ctx.fillStyle = '#05050d'; ctx.fillRect(0, 0, cv.width, cv.height * 0.172); } // hide the letterbox's burned-in title
    }
    if (siteK > 0) {
      const fi = clamp(Math.floor(siteTime(t) * FPS), 0, siteMeta.frames - 1);
      cover(ctx, await img(`work/site/${pad(fi, 4)}.jpg`), cv.width, cv.height, 1, eOut(siteK));
    }
  }
  const dark = t < 3.0 ? 1 : 0;
  set($('shade'), { background: `linear-gradient(180deg, rgb(7 7 28 / ${dark * 0.55}) 0%, rgb(7 7 28 / ${dark * 0.15}) 30%, rgb(7 7 28 / ${dark * 0.25}) 50%, rgb(7 7 28 / ${dark * 0.9}) 72%, rgb(7 7 28 / ${dark * 0.95}) 100%)` });

  // ---------- payoff: the opened Reel, full screen with its own audio ----------
  if (t >= 7.0 && t < 9.75) {
    const r = { x: lerp(phone.x, 0, popK), y: lerp(phone.y, 0, popK), w: lerp(phone.w, W, popK), h: lerp(phone.h, H, popK), rad: lerp(phone.r, 0, popK) };
    set($('pop'), { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', borderRadius: r.rad + 'px', opacity: 1 - eInOut(prog(t, 9.5, 9.75)) });
    size(pv, r.w, r.h);
    cover(pctx, await img(`work/pop/${pad(clamp(Math.floor((t - 7.0) * FPS), 0, 74) + 1, 2)}.jpg`), pv.width, pv.height);
  } else set($('pop'), { display: 'none' });

  // ---------- backgrounds ----------
  set($('bg'), { opacity: prog(t, 3.45, 3.7) });
  set($('wall'), { opacity: t >= 9.5 ? 1 : 0, transform: `rotate(-9deg) translateY(${-Math.max(0, t - 9.5) * 26}px)` });
  for (const s of SLOTS) { const a = 9.5 + s.d * 0.4, k = prog(t, a, a + 0.4);
    set(s.el, { opacity: eOut(k), transform: `translate(${s.x}px, ${s.y + (1 - eBack(k)) * (s.x < 0 ? -1 : 1) * 260}px) scale(${lerp(1.3, 1, eOut(k))})` }); }
  set($('endShade'), { opacity: eOut(prog(t, 9.5, 9.9)) });

  // ---------- hook type ----------
  const hookOn = t < 3.0;
  words($('tryTop'), t, -1, 0, 0.01);                    // fully on screen from frame 0
  set($('tryTop'), { opacity: hookOn ? 1 : 0 });
  let h = 0; while (h + 1 < HOOK.length && t >= HOOK[h + 1].a) h++;
  let v;
  if (h < 5) { const from = h ? D.cum[h - 1] : 0; v = lerp(from, D.cum[h], eOut(prog(t, HOOK[h].a, HOOK[h].a + 0.3))); }
  else v = lerp(D.cum[4], D.total, eOut(prog(t, 2.5, 2.95)));            // the last beat runs on to the total of every Reel
  $('num').textContent = fmt.format(Math.round(v));
  const settle = prog(t, HOOK[h].a, HOOK[h].a + 0.12);
  set($('num'), { transform: `scale(${lerp(1.08, 1, eOut(settle))})`, color: h === 5 && t >= 2.95 ? 'var(--cyan)' : 'var(--cream)' });
  $('numUnit').textContent = t >= 2.95 ? `צפיות, בכל ${D.reels} הריילס` : 'צפיות';   // only once the counter shows the real total
  for (const id of ['numLabel', 'numBox', 'numUnit']) $(id).style.opacity = hookOn && t > 0.04 ? 1 : 0;
  let flash = 0; for (const x of HOOK.slice(1)) flash = Math.max(flash, 1 - prog(t, x.a, x.a + 0.09));
  flash = hookOn ? flash * 0.4 : 0;
  if (t >= 7.0) flash = Math.max(flash, (1 - prog(t, 7.0, 7.22)) * 0.5);
  if (t >= 10.0) flash = Math.max(flash, (1 - prog(t, 10.0, 10.18)) * 0.2);
  set($('flash'), { opacity: flash });

  // ---------- reversal: "עצרת." on the freeze, "כמו עוד N צפיות." on the drop ----------
  const st = prog(t, 3.0, 3.18);
  const up = eInOut(prog(t, 3.5, 3.9));
  const out = eInOut(prog(t, 4.55, 4.85));
  set($('stopped'), { opacity: t < 3.0 ? 0 : 1 - out, top: lerp(640, 290, up) + 'px', fontSize: lerp(330, 170, up) + 'px', transform: `translateY(${-out * 80}px) scale(${lerp(1.18, 1, eBack(st))})` });
  set($('likeOthers'), { opacity: eOut(prog(t, 3.55, 3.8)) * (1 - out), transform: `translateY(${(1 - eOut(prog(t, 3.55, 3.8))) * 24 - out * 80}px)` });

  // ---------- chip during the stats hold ----------
  const ck = env(t, 5.0, 6.1, 0.35, 0.25);
  set($('chipLive'), { opacity: ck, top: '1180px', left: '40px', transform: `scale(${lerp(0.7, 1, eBack(prog(t, 5.0, 5.42)))})`, transformOrigin: '0% 50%' });

  // ---------- tap on the card ----------
  const tx = phone.x + siteMeta.tap.x * phone.w, ty = phone.y + siteMeta.tap.y * phone.h;
  const press = prog(t, TAP_T - 0.26, TAP_T), rel = prog(t, TAP_T, TAP_T + 0.45);
  set($('tapDot'), { left: tx + 'px', top: ty + 'px', opacity: t < TAP_T - 0.26 || t > 7.3 ? 0 : (1 - rel) * eOut(press), transform: `scale(${lerp(1.25, 0.82, eOut(press))})` });
  set($('tapRing'), { left: tx + 'px', top: ty + 'px', opacity: rel > 0 && rel < 1 ? 1 - rel : 0, transform: `scale(${lerp(0.6, 3, eOut(rel))})` });

  // ---------- end card ----------
  const lk = eOut(prog(t, 9.5, 9.8));
  set($('logo'), { opacity: lk, transform: `scale(${lerp(0.9, 1, eBack(prog(t, 9.5, 9.9)))})` });
  const dot = $('logo').querySelector('path:last-of-type');
  if (dot) { dot.style.transformBox = 'fill-box'; dot.style.transform = `translateY(${(1 - bounce(prog(t, 9.78, 10.38))) * -26}px)`; } // lands on the 10.0 beat
  for (const id of ['endA', 'endB', 'endC']) $(id).style.opacity = t > 9.6 ? 1 : 0;
  words($('endA'), t, 9.65, 0.08); words($('endB'), t, 10.0, 0.06); words($('endC'), t, 10.25, 0.08);
  [...$('arrows').children].forEach((a, i) => { const ph = ((t - 10.5) * 2 - i * 0.25) % 1;
    a.style.opacity = t > 10.5 ? 0.25 + 0.75 * Math.max(0, Math.sin(Math.PI * clamp(ph < 0 ? ph + 1 : ph))) : 0; });
  set($('arrows'), { transform: `translateY(${Math.sin(Math.max(0, t - 10.5) * Math.PI * 2) * 6}px)` });
  set($('zoneGlow'), { opacity: prog(t, 10.5, 10.9) * (0.75 + 0.25 * Math.cos((t - 11.0) * Math.PI * 4)) + (t >= 11.5 ? (1 - prog(t, 11.5, 11.9)) * 0.5 : 0) });
  // the final event: a tap on the sticker zone at 11.5 (on the beat)
  const ep = prog(t, 11.24, 11.5), er = prog(t, 11.5, 11.95);
  set($('endDot'), { left: ZONE.x + 'px', top: ZONE.y + 'px', opacity: t < 11.24 ? 0 : (1 - er) * eOut(ep), transform: `scale(${lerp(1.25, 0.82, eOut(ep))})` });
  set($('endRing'), { left: ZONE.x + 'px', top: ZONE.y + 'px', opacity: er > 0 && er < 1 ? 1 - er : 0, transform: `scale(${lerp(0.6, 4, eOut(er))})` });
};
</script>
</body>
</html>
