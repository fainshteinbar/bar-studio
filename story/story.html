<!doctype html>
<!-- bfain.studio launch Story v4 "נסה לא לעצור.", 1080x1920, 12 s. Deterministic: window.render(t) draws the frame
     at t seconds; story/render.mjs captures it frame by frame and mixes the audio.
     Concept: a challenge to the viewer. A counter of "times people stopped here" runs to the live total; the freeze
     says the viewer stopped too; the live site (full-bleed) leads to a Reel whose reveal catches them again ("עצרת
     שוב."); the end card dares them through every Reel and taps the link-sticker zone.
     Every number is read from data/instagram.json at render time. Music: 120 BPM, a beat every 0.5 s, silence
     3.0-3.5, drop at 3.5. Safe zones: nothing important above y 270 or below y 1536. Footage in story/work:
     hook/ (six Reels at their peak moments), site/ + site.json (live-site recording, 9:16), pop/ (the payoff). -->
<html lang="he">
<head>
<meta charset="utf-8">
<title>bfain.studio launch Story</title>
<link rel="stylesheet" href="https://use.typekit.net/gce3kmw.css">
<style>
@font-face { font-family: "Hebrew"; font-weight: 100 900; src: url("../assets/fonts/noto-sans-hebrew-var-hebrew.woff2") format("woff2"); }
:root { --void: #07071C; --navy: #1A1464; --cyan: #00C2FF; --cream: #F4F0E8; --display: "narkiss-hadash-condensed", "Hebrew", sans-serif; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: clip; background: var(--void); color: var(--cream); font-family: "Hebrew", sans-serif; }
.layer { position: absolute; inset: 0; }
.big, .small { direction: rtl; }
#wall { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.card { position: absolute; width: 300px; height: 533px; margin: -266px 0 0 -150px; border-radius: 24px; overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
#endShade { background: radial-gradient(80% 60% at 50% 50%, rgb(7 7 28 / 0.9), rgb(7 7 28 / 0.75) 70%, rgb(7 7 28 / 0.85)); }
#zoneGlow { position: absolute; left: 540px; top: 1462px; width: 860px; height: 300px; translate: -50% -50%; border-radius: 50%; background: radial-gradient(closest-side, rgb(0 194 255 / 0.34), rgb(0 194 255 / 0.08) 60%, transparent); }
#screen, #pop { position: absolute; overflow: hidden; background: #000; }
#screen { inset: 0; }
#screen canvas, #pop canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#shade { position: absolute; inset: 0; }
.big { position: absolute; inset-inline: 0; text-align: center; font-family: var(--display); font-weight: 800; line-height: 0.92; text-shadow: 0 6px 40px rgb(7 7 28 / 0.55); }
.small { position: absolute; inset-inline: 0; text-align: center; font: 600 64px/1.15 "Hebrew", sans-serif; text-shadow: 0 3px 18px rgb(7 7 28 / 0.7); }
.w { display: inline-block; overflow: clip; padding-block: 0.08em; margin-block: -0.08em; vertical-align: top; }
.w > span { display: inline-block; }
.cyan { color: var(--cyan); }
#numBox { position: absolute; inset-inline: 0; top: 1424px; height: 110px; overflow: clip; text-align: center; }
#num { display: inline-block; font: 800 110px/1 var(--display); text-shadow: 0 4px 24px rgb(7 7 28 / 0.6); }
.ripple { position: absolute; border-radius: 50%; translate: -50% -50%; }
#tapDot, #endDot, #swipe { width: 84px; height: 84px; background: rgb(244 240 232 / 0.9); box-shadow: 0 6px 24px rgb(0 0 0 / 0.5), 0 0 0 10px rgb(244 240 232 / 0.18); }
#tapRing, #endRing { width: 84px; height: 84px; border: 6px solid var(--cyan); }
#logo { position: absolute; left: 50%; translate: -50% 0; width: 250px; top: 330px; }
#logo svg { width: 100%; height: auto; display: block; overflow: visible; }
#arrows { position: absolute; left: 50%; translate: -50% 0; top: 1268px; display: flex; flex-direction: column; align-items: center; }
#arrows svg { display: block; margin-block-start: -14px; }
#flash { background: var(--cream); mix-blend-mode: overlay; }
</style>
</head>
<body>
<div id="wall"></div>
<div id="endShade" class="layer"></div>
<div id="zoneGlow"></div>

<div id="screen"><canvas id="cv" width="1080" height="1920"></canvas><div id="shade"></div></div>
<div id="pop"><canvas id="pv"></canvas></div>

<!-- hook: the challenge, and the count of times people stopped here -->
<div id="tryTop" class="big" style="top:300px;font-size:150px"><span class="w"><span>נסה</span></span> <span class="w"><span>לא</span></span> <span class="w"><span class="cyan">לעצור.</span></span></div>
<div id="numLabel" class="small cyan" style="top:1352px">פעמים שעצרו כאן:</div>
<div id="numBox"><bdi dir="ltr" id="num">0</bdi></div>

<!-- the reversal -->
<div id="stopped" class="big" style="top:640px;font-size:330px">עצרת.</div>
<div id="likeOthers" class="small" style="top:990px;font-size:76px"></div>

<div id="swipe" class="ripple"></div>
<div id="tapRing" class="ripple"></div><div id="tapDot" class="ripple"></div>

<!-- the callback on the payoff -->
<div id="again" class="big" style="top:1036px;font-size:210px">עצרת <span class="cyan">שוב.</span></div>

<!-- end card -->
<div id="logo"></div>
<div id="endA" class="big" style="top:520px;font-size:200px"><span class="w"><span id="endCount">18</span></span> <span class="w"><span>סרטונים.</span></span></div>
<div id="endB" class="big" style="top:740px;font-size:150px"><span class="w"><span>נסה</span></span> <span class="w"><span>לעבור</span></span> <span class="w"><span>את</span></span> <span class="w"><span>כולם</span></span></div>
<div id="endC" class="big cyan" style="top:900px;font-size:200px"><span class="w"><span>בלי</span></span> <span class="w"><span>לעצור.</span></span></div>
<div id="arrows"></div>
<div id="endRing" class="ripple"></div><div id="endDot" class="ripple"></div>
<div id="flash" class="layer"></div>

<script>
const W = 1080, H = 1920, FPS = 30;
const ZONE = { x: 540, y: 1462 };                                   // link-sticker centre
// Hook: six Reels at their peak moments, one per beat. "רגע" (the word stuffed in the mouth) opens; the
// meatballs reveal closes and is the freeze frame. z = zoom; mask = letterbox title to hide.
const HOOK = [
  { c: 0, id: '17901612813374816', a: 0.0, z: 1 },
  { c: 1, id: '18112796969467846', a: 0.5, z: 1 },
  { c: 2, id: '18115863469771345', a: 1.0, z: 1 },
  { c: 3, id: '17996145848834714', a: 1.5, z: 1 },
  { c: 4, id: '18130994455682363', a: 2.0, z: 1 },
  { c: 5, id: '17943051837086700', a: 2.5, z: 2.0, mask: true },
];
const REVEAL_T = 7.8, CALLBACK_T = REVEAL_T + 0.6;                   // the ChatGPT head, then "עצרת שוב."
const POSTERS = ['17943051837086700','18112796969467846','18115863469771345','17996145848834714','17957239818238876','17981987253079891','18130994455682363','18633783094026616','17901612813374816','18113922386100931','18105146096190451','17958556212232372','18127153129842174','18487666432129017','18110908592128454','18627196816008046','18118270045962443'];
let D = null, siteMeta = null;

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (k) => 1 - (1 - k) ** 3;
const eInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2);
const eBack = (k) => { const c = 1.7; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; };
const bounce = (k) => { const n = 7.5625, d = 2.75;
  if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
  if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375; return n * (k -= 2.625 / d) * k + 0.984375; };
const set = (el, css) => Object.assign(el.style, css);
const pad = (n, l) => String(n).padStart(l, '0');
const piece = (t, pts) => { if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], (t - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
  return pts[pts.length - 1][1]; };
const words = (el, t, start, gap = 0.07, dur = 0.34) => el.querySelectorAll('.w > span').forEach((s, i) => {
  const k = eOut(prog(t, start + i * gap, start + i * gap + dur)); s.style.transform = `translateY(${(1 - k) * 108}%)`; });
const fmt = new Intl.NumberFormat('he-IL');

const SLOTS = [];
for (let c = 0; c < 5; c++) for (let r = 0; r < 4; r++) {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<img src="../media/ig/${POSTERS[(c * 4 + r * 3) % POSTERS.length]}.webp" alt="">`;
  $('wall').append(el);
  SLOTS.push({ el, x: (c - 2) * 322, y: (r - 1.5) * 555 + (c % 2 ? 140 : -60), d: ((c * 7 + r * 5) % 11) / 11 });
}
fetch('work/logo.svg').then((r) => r.text()).then((s) => { $('logo').innerHTML = s.replace(/<metadata>[\s\S]*?<\/metadata>/, ''); });
$('arrows').innerHTML = [0, 1].map(() => '<svg width="70" height="44" viewBox="0 0 70 44"><path d="M6 6 L35 34 L64 6" fill="none" stroke="#00C2FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>').join('');

const cache = new Map();
const img = (url) => { if (!cache.has(url)) { const im = new Image(); im.src = url; cache.set(url, im.decode().then(() => im)); if (cache.size > 16) cache.delete(cache.keys().next().value); } return cache.get(url); };
const cover = (ctx, im, cw, ch, z = 1) => { const s = Math.max(cw / im.naturalWidth, ch / im.naturalHeight) * z, w = im.naturalWidth * s, h = im.naturalHeight * s;
  ctx.drawImage(im, (cw - w) / 2, (ch - h) / 2, w, h); };
const cv = $('cv'), ctx = cv.getContext('2d'), pv = $('pv'), pctx = pv.getContext('2d');
const size = (c, w, h) => { w = Math.max(2, Math.round(w)); h = Math.max(2, Math.round(h)); if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } };

window.ready = (async () => {
  const m = await (await fetch('../data/instagram.json', { cache: 'no-store' })).json();
  D = { total: m.stats.total_views, reels: m.stats.shown };
  $('likeOthers').textContent = `כמו ${fmt.format(D.total)} הפעמים שלפניך.`;
  $('endCount').textContent = D.reels;
  siteMeta = await (await fetch('work/site.json', { cache: 'no-store' })).json();
  await document.fonts.load('800 100px narkiss-hadash-condensed', 'אבג0');
  await document.fonts.load('600 40px Hebrew', 'א');
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  return document.fonts.check('800 100px narkiss-hadash-condensed', 'א') && { total: D.total, reels: D.reels };
})();

// Site recording time for story time t (marks from story/record-site.mjs): hero 0.8 s, scroll, stats held 1.2 s,
// scroll to the grid, then the last frame before the tap is held while the finger presses.
const siteTime = (t) => { const k = siteMeta.marks; return piece(t, [[3.5, 0.0], [4.3, k.proofScroll], [4.7, k.holdStart], [5.9, k.holdStart + 1.2], [5.95, k.holdEnd], [6.5, k.gridEnd], [6.6, k.tap - 0.05]]); };
const TAP_T = 7.0, PRESS_T = 6.6;                                    // pressed state on screen 0.4 s before the cut
const SWIPES = [[4.3, 4.7], [5.95, 6.5]];                             // finger visible while the page scrolls

window.render = async (t) => {
  // ---------- footage on the full-bleed screen (hook, freeze, site) ----------
  if (t < 7.25) {
    $('screen').style.display = 'block';
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (t < 3.5) {
      let h = HOOK.length - 1; while (h > 0 && t < HOOK[h].a) h--;
      const hk = HOOK[h], frozen = t >= 3.0, fi = frozen ? 14 : Math.min(14, Math.floor((t - hk.a) * FPS));
      const punch = frozen ? 1.04 : lerp(hk.z > 1 ? 1.06 : 1.12, 1, eOut(prog(t, hk.a, hk.a + 0.45)));
      ctx.filter = frozen ? 'blur(22px) brightness(0.3) saturate(0.6)' : 'none';    // freeze: 70% darker, nothing readable
      cover(ctx, await img(`work/hook/c${hk.c}_${pad(fi + 1, 2)}.jpg`), W, H, hk.z * punch);
      ctx.filter = 'none';
      if (hk.mask && !frozen) { ctx.fillStyle = '#05050d'; ctx.fillRect(0, 0, W, H * 0.172); }   // the letterbox's burned-in title
    } else {
      const fi = clamp(Math.floor(siteTime(t) * FPS), 0, siteMeta.frames - 1);
      const z = lerp(1.06, 1, eOut(prog(t, 3.5, 3.9)));                // the drop lands on the site
      cover(ctx, await img(`work/site/${pad(fi, 4)}.jpg`), W, H, z);
    }
  } else $('screen').style.display = 'none';
  const dark = t < 3.0 && t >= 0.5 ? 1 : 0;
  // a dark band behind the counter (y 1270-1560) so no Reel's own subtitles show through under it; faces sit above it
  set($('shade'), { background: `linear-gradient(180deg, rgb(7 7 28 / ${t < 3.0 ? 0.5 : 0}) 0%, rgb(7 7 28 / 0) 28%, rgb(7 7 28 / 0) 57%, rgb(7 7 28 / ${dark * 0.9}) 67%, rgb(7 7 28 / ${dark * 0.93}) 82%, rgb(7 7 28 / ${dark * 0.85}) 100%)` });

  // ---------- payoff: the opened Reel grows from its card to full screen, with its own audio ----------
  if (t >= TAP_T && t < 9.75) {
    const k = eInOut(prog(t, TAP_T, TAP_T + 0.25));
    const card = { x: siteMeta.tap.x * W - 243, y: siteMeta.tap.y * H - 440, w: 486, h: 1000 };
    set($('pop'), { display: 'block', left: lerp(card.x, 0, k) + 'px', top: lerp(card.y, 0, k) + 'px', width: lerp(card.w, W, k) + 'px', height: lerp(card.h, H, k) + 'px',
      borderRadius: lerp(28, 0, k) + 'px', opacity: 1 - eInOut(prog(t, 9.5, 9.75)) });
    size(pv, lerp(card.w, W, k), lerp(card.h, H, k));
    cover(pctx, await img(`work/pop/${pad(clamp(Math.floor((t - TAP_T) * FPS), 0, 74) + 1, 2)}.jpg`), pv.width, pv.height);
  } else set($('pop'), { display: 'none' });

  // ---------- end-card background ----------
  set($('wall'), { opacity: t >= 9.5 ? 1 : 0, transform: `rotate(-9deg) translateY(${-Math.max(0, t - 9.5) * 26}px)` });
  for (const s of SLOTS) { const a = 9.5 + s.d * 0.4, k = prog(t, a, a + 0.4);
    set(s.el, { opacity: eOut(k), transform: `translate(${s.x}px, ${s.y + (1 - eBack(k)) * (s.x < 0 ? -1 : 1) * 260}px) scale(${lerp(1.3, 1, eOut(k))})` }); }
  set($('endShade'), { opacity: eOut(prog(t, 9.5, 9.9)) });

  // ---------- hook type ----------
  const hookOn = t < 3.0;
  words($('tryTop'), t, -1, 0, 0.01);                                  // on screen from frame 0
  set($('tryTop'), { opacity: hookOn ? 1 : 0 });
  // one continuous count from 0 to the live total; frame 0 (the "רגע" mouth) stays unobstructed
  const ck = eOut(prog(t, 0.5, 3.0));
  $('num').textContent = fmt.format(Math.round(D.total * ck));
  set($('num'), { color: t >= 2.98 ? 'var(--cyan)' : 'var(--cream)' });
  for (const id of ['numLabel', 'numBox']) $(id).style.opacity = hookOn && t >= 0.5 ? 1 : 0;
  let flash = 0; for (const x of HOOK.slice(1)) flash = Math.max(flash, 1 - prog(t, x.a, x.a + 0.09));
  flash = hookOn ? flash * 0.4 : 0;
  if (t >= TAP_T) flash = Math.max(flash, (1 - prog(t, TAP_T, TAP_T + 0.2)) * 0.45);
  if (t >= CALLBACK_T) flash = Math.max(flash, (1 - prog(t, CALLBACK_T, CALLBACK_T + 0.15)) * 0.3);
  if (t >= 10.0) flash = Math.max(flash, (1 - prog(t, 10.0, 10.18)) * 0.2);
  set($('flash'), { opacity: flash });

  // ---------- the reversal, on the blurred freeze ----------
  const inFreeze = t >= 3.0 && t < 3.5;
  set($('stopped'), { opacity: inFreeze ? 1 : 0, transform: `scale(${lerp(1.18, 1, eBack(prog(t, 3.0, 3.18)))})` });
  const lo = eOut(prog(t, 3.18, 3.34));
  set($('likeOthers'), { opacity: inFreeze ? lo : 0, transform: `translateY(${(1 - lo) * 20}px)` });

  // ---------- touch: a finger while the page scrolls, then the press on "מונולוג" ----------
  let sw = null;
  for (const [a, b] of SWIPES) if (t >= a - 0.08 && t <= b + 0.08) sw = [a, b];
  if (sw) { const k = eInOut(prog(t, sw[0], sw[1]));
    set($('swipe'), { opacity: Math.min(prog(t, sw[0] - 0.08, sw[0]), 1 - prog(t, sw[1], sw[1] + 0.08)) * 0.95, left: '760px', top: lerp(1380, 760, k) + 'px', transform: 'scale(0.9)' }); }
  else $('swipe').style.opacity = 0;
  const tx = siteMeta.tap.x * W, ty = siteMeta.tap.y * H;
  const press = prog(t, PRESS_T - 0.15, PRESS_T), rel = prog(t, TAP_T, TAP_T + 0.45);
  set($('tapDot'), { left: tx + 'px', top: ty + 'px', opacity: t < PRESS_T - 0.15 || t > TAP_T + 0.3 ? 0 : (1 - rel) * eOut(press), transform: `scale(${lerp(1.3, 0.8, eOut(press))})` });
  set($('tapRing'), { left: tx + 'px', top: ty + 'px', opacity: rel > 0 && rel < 1 ? 1 - rel : 0, transform: `scale(${lerp(0.6, 3, eOut(rel))})` });

  // ---------- callback: "עצרת שוב." 0.6 s after the ChatGPT reveal, between the head and the Reel's caption ----------
  const ak = prog(t, CALLBACK_T, CALLBACK_T + 0.3);
  set($('again'), { opacity: t >= CALLBACK_T && t < 9.55 ? eOut(ak) * (1 - prog(t, 9.4, 9.55)) : 0, transform: `scale(${lerp(1.25, 1, eBack(ak))})` });

  // ---------- end card ----------
  const lk = eOut(prog(t, 9.5, 9.8));
  set($('logo'), { opacity: lk, transform: `scale(${lerp(0.9, 1, eBack(prog(t, 9.5, 9.9)))})` });
  const dot = $('logo').querySelector('path:last-of-type');
  if (dot) { dot.style.transformBox = 'fill-box'; dot.style.transform = `translateY(${(1 - bounce(prog(t, 9.78, 10.38))) * -26}px)`; } // lands on the 10.0 beat
  for (const id of ['endA', 'endB', 'endC']) $(id).style.opacity = t > 9.6 ? 1 : 0;
  words($('endA'), t, 9.65, 0.08); words($('endB'), t, 10.0, 0.06); words($('endC'), t, 10.25, 0.08);
  [...$('arrows').children].forEach((a, i) => { const ph = ((t - 10.5) * 2 - i * 0.25) % 1;
    a.style.opacity = t > 10.5 ? 0.25 + 0.75 * Math.max(0, Math.sin(Math.PI * clamp(ph < 0 ? ph + 1 : ph))) : 0; });
  set($('arrows'), { transform: `translateY(${Math.sin(Math.max(0, t - 10.5) * Math.PI * 2) * 6}px)` });
  set($('zoneGlow'), { opacity: prog(t, 10.5, 10.9) * (0.75 + 0.25 * Math.cos((t - 11.0) * Math.PI * 4)) + (t >= 11.5 ? (1 - prog(t, 11.5, 11.9)) * 0.5 : 0) });
  const ep = prog(t, 11.24, 11.5), er = prog(t, 11.5, 11.95);                 // the final event: a tap on the sticker zone
  set($('endDot'), { left: ZONE.x + 'px', top: ZONE.y + 'px', opacity: t < 11.24 ? 0 : (1 - er) * eOut(ep), transform: `scale(${lerp(1.25, 0.82, eOut(ep))})` });
  set($('endRing'), { left: ZONE.x + 'px', top: ZONE.y + 'px', opacity: er > 0 && er < 1 ? 1 - er : 0, transform: `scale(${lerp(0.6, 4, eOut(er))})` });
};
</script>
</body>
</html>
