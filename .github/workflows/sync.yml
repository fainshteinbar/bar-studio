# Daily Instagram → Bunny CDN sync, caption translation, site rebuild and deploy (PLAN.md 4.6).
name: Instagram sync

on:
  schedule:
    - cron: '23 4 * * *' # daily, 07:23 Israel time
  workflow_dispatch:
    inputs:
      force:
        description: Reprocess and re-upload every Reel
        type: boolean
        default: false
  push:
    branches: [phase3] # first run before go-live; removed after the merge to main

concurrency:
  group: ig-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check token and PAT expiry (fail early, 7-day warning)
        env:
          IG_EXP: ${{ vars.IG_TOKEN_EXPIRES_AT }}
          PAT_EXP: ${{ vars.GH_PAT_EXPIRES_AT }}
        run: |
          check() {
            if [ -z "$2" ]; then echo "::warning::$1 is not set"; return 0; fi
            left=$(( ( $(date -u -d "$2" +%s) - $(date -u +%s) ) / 86400 ))
            echo "$1: $left days left ($2)"
            if [ "$left" -lt 7 ]; then echo "::error::$1 expires in $left days ($2). Renew it (see PLAN.md section 5)."; exit 1; fi
          }
          check "Instagram token" "$IG_EXP"
          check "GitHub PAT" "$PAT_EXP"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and cwebp (the scripts themselves have no npm dependencies)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg webp >/dev/null

      - name: Sync Reels to Bunny and translate captions
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/ig-sync.mjs --upload ${{ inputs.force && '--force' || '' }}

      - name: Build
        env:
          MANIFEST: committed
        run: node scripts/build.mjs

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/instagram.json data/translations.json index.html en/index.html sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git -c user.name="bfain-sync" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Sync Instagram Reels ($(date -u +%F))"
          git push
          # Pushes made with GITHUB_TOKEN may not start a Pages build on their own; request one.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || echo "::warning::Pages build request failed"; fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Site automation needs attention: Instagram sync"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          body="The daily sync failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Common causes: the Instagram token expired or was revoked (regenerate it in the Meta app dashboard, then run gh secret set IG_ACCESS_TOKEN), the GitHub PAT expired (create a new one, gh secret set GH_SECRETS_PAT, update the GH_PAT_EXPIRES_AT variable), or Bunny rejected the upload (check BUNNY_STORAGE_PASSWORD). See PLAN.md section 5."
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
