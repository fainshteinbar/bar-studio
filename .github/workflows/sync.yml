# Hourly Instagram → Bunny CDN sync, caption translation, site rebuild and deploy (PLAN.md 4.6).
# Each run reads the media list and every Reel's views (scripts/ig-sync.mjs --detect) and picks a mode:
#   full  - a Reel added/removed, caption edited, hidden list changed, or an English caption pending:
#           ffmpeg, download, transcode, upload, translate, build, commit
#   stats - only a number a visitor sees changed (e.g. 211K -> 212K, the proof-row total): build and commit
#   none  - nothing visible changed: stop, nothing downloaded, uploaded, translated or committed
name: Instagram sync

# Hourly trigger: cron-job.org calls the workflow_dispatch API at minute 17 with source=cron (GitHub's own
# scheduler dropped most hourly slots); GitHub's schedule at minute 47 stays as a backup.
on:
  schedule:
    - cron: '47 * * * *' # backup, hourly at minute 47
  workflow_dispatch:
    inputs:
      force:
        description: Reprocess and re-upload every Reel
        type: boolean
        default: false
      source:
        description: Who started the run (cron-job.org sends "cron")
        type: string
        default: manual

concurrency:
  group: ig-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check token and PAT expiry (7-day warning; scheduled runs check once a day)
        env:
          IG_EXP: ${{ vars.IG_TOKEN_EXPIRES_AT }}
          PAT_EXP: ${{ vars.GH_PAT_EXPIRES_AT }}
          CRON_EXP: ${{ vars.CRON_PAT_EXPIRES_AT }}
          AUTOMATIC: ${{ github.event_name == 'schedule' || inputs.source == 'cron' }}
        run: |
          # Automatic runs check only at 04 UTC, so a warning fails one run a day, not 24; manual runs always check.
          if [ "$AUTOMATIC" = "true" ] && [ "$(date -u +%H)" != "04" ]; then echo "Expiry check runs at 04 UTC."; exit 0; fi
          check() {
            if [ -z "$2" ]; then echo "::warning::$1 is not set"; return 0; fi
            left=$(( ( $(date -u -d "$2" +%s) - $(date -u +%s) ) / 86400 ))
            echo "$1: $left days left ($2)"
            if [ "$left" -lt 7 ]; then echo "::error::$1 expires in $left days ($2). Renew it (see PLAN.md section 5)."; exit 1; fi
          }
          check "Instagram token" "$IG_EXP"
          check "GitHub PAT" "$PAT_EXP"
          check "cron-job.org token" "$CRON_EXP"

      - name: Keep the schedules alive (once a day)
        if: github.event_name == 'schedule' || inputs.source == 'cron'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub disables scheduled workflows after 60 days without repository activity, and runs with nothing
          # new commit nothing, so the 04 UTC run re-enables both workflows through the API.
          if [ "$(date -u +%H)" != "04" ]; then exit 0; fi
          for wf in sync.yml token-refresh.yml; do gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf/enable" >/dev/null || echo "::warning::could not re-enable $wf"; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look for new or changed Reels and changed view counts
        id: detect
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: node scripts/ig-sync.mjs --upload --detect ${{ inputs.force && '--force' || '' }}

      - name: Install ffmpeg and cwebp (new or changed Reels only)
        if: steps.detect.outputs.mode == 'full'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg webp >/dev/null

      - name: Sync (full - Reels to Bunny, translation; stats - fresh view counts only)
        if: steps.detect.outputs.mode != 'none'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/ig-sync.mjs --upload ${{ inputs.force && '--force' || '' }}

      - name: Build
        if: steps.detect.outputs.mode != 'none'
        run: node scripts/build.mjs

      - name: Commit and publish
        if: steps.detect.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.detect.outputs.mode == 'full' && 'new or changed Reels' || 'view counts or English captions' }}
        run: |
          git add -A data/instagram.json data/translations.json index.html en/index.html sitemap.xml robots.txt assets/first
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git -c user.name="bfain-sync" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Sync Instagram Reels, ${MODE} ($(date -u +'%F %H:%M') UTC)"
          git push
          # Pushes made with GITHUB_TOKEN may not start a Pages build on their own; request one.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || echo "::warning::Pages build request failed"; fi

      - name: Open an issue on failure (at most one comment a day)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Site automation needs attention: Instagram sync"
          read -r existing updated <<< "$(gh issue list --state open --search "\"$title\" in:title" --json number,updatedAt -q '.[0] | "\(.number) \(.updatedAt)"')"
          body="The Instagram sync failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Common causes: the Instagram token expired or was revoked (regenerate it in the Meta app dashboard, then run gh secret set IG_ACCESS_TOKEN), the GitHub PAT expired (create a new one, gh secret set GH_SECRETS_PAT, update the GH_PAT_EXPIRES_AT variable), or Bunny rejected the upload (check BUNNY_STORAGE_PASSWORD). See PLAN.md section 5."
          if [ -z "$existing" ] || [ "$existing" = "null" ]; then gh issue create --title "$title" --body "$body"; exit 0; fi
          if [ $(( $(date -u +%s) - $(date -u -d "$updated" +%s) )) -lt 72000 ]; then echo "Issue #$existing was updated in the last 20 h; not commenting again."; exit 0; fi
          gh issue comment "$existing" --body "$body"
